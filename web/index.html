<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Canvases</title>
<style>
:root { --bg: #0a0a0a; --panel: #111111; --hover: #171717; --line: rgba(255,255,255,.08); --text: #ececec; --muted: #8e8e8e; --faint: #5a5a5a; --accent: #346bf1;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg: #f3f3f4; --panel: #fff; --hover: #fafafa; --line: rgba(0,0,0,.09); --text: #18181b; --muted: #6b6b73; --faint: #a3a3ab; --accent: #2f63e6; color-scheme: light; } }
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
main { max-width: 760px; margin: 0 auto; padding: calc(32px + env(safe-area-inset-top, 0px)) 16px 48px; }
h1 { margin: 0 0 20px; font-size: 20px; font-weight: 600; letter-spacing: -.01em; }
ul { list-style: none; margin: 0; padding: 0; border: 1px solid var(--line); border-radius: 12px; background: var(--panel); overflow: hidden; }
li + li { border-top: 1px solid var(--line); }
a { display: flex; align-items: center; gap: 16px; padding: 14px 16px; color: inherit; text-decoration: none; }
a:hover { background: var(--hover); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: -2px; }
.t { flex: 1; min-width: 0; }
.t b { display: block; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.t span { color: var(--faint); font-size: 12px; }
.m { color: var(--muted); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; text-align: right; }
.empty { padding: 32px 16px; color: var(--muted); text-align: center; }
</style>
</head>
<body>
<main>
  <h1>Canvases</h1>
  <ul id="list"><li class="empty">Loading…</li></ul>
</main>
<script>
(async () => {
  const list = document.getElementById('list');
  const r = await fetch('/api/canvases', { cache: 'no-store' });
  if (r.status === 401) { location.href = '/login?next=/'; return; }
  const items = r.ok ? await r.json() : null;
  const ago = t => {
    const s = (Date.now() - t) / 1000;
    if (s < 60) return 'just now';
    if (s < 3600) return Math.round(s / 60) + ' min ago';
    if (s < 86400) return Math.round(s / 3600) + ' h ago';
    return new Date(t).toLocaleDateString(undefined, { day: 'numeric', month: 'short' });
  };
  list.textContent = '';
  if (!items || !items.length) { list.innerHTML = `<li class="empty">${items ? 'No canvases yet' : 'Canvases didn’t load'}</li>`; return; }
  for (const c of items) {
    const li = document.createElement('li');
    li.innerHTML = '<a><span class="t"><b></b><span></span></span><span class="m"></span></a>';
    li.querySelector('a').href = '/c/' + encodeURIComponent(c.id);
    li.querySelector('b').textContent = c.title;
    li.querySelector('.t span').textContent = c.id;
    const notes = c.notes ? ` · ${c.notes} note${c.notes === 1 ? '' : 's'}` : '';
    li.querySelector('.m').textContent = `${c.boards} board${c.boards === 1 ? '' : 's'}${notes}\n${ago(c.updatedAt)}`;
    li.querySelector('.m').style.whiteSpace = 'pre';
    list.appendChild(li);
  }
})();
</script>
</body>
</html>
