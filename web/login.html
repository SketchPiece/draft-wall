<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Draftwall</title>
<style>
:root { --bg: #0a0a0a; --panel: #111111; --field: #0a0a0a; --line: rgba(255,255,255,.1); --text: #ececec; --muted: #8e8e8e; --accent: #346bf1; --danger: #ff6369;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg: #f3f3f4; --panel: #fff; --field: #fafafa; --line: rgba(0,0,0,.12); --text: #18181b; --muted: #6b6b73; --accent: #2f63e6; --danger: #d93036; color-scheme: light; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
form { width: min(340px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
h1 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
label { color: var(--muted); font-size: 12px; }
input { width: 100%; height: 40px; padding: 0 12px; border: 1px solid var(--line); border-radius: 9px; background: var(--field); color: var(--text); font: inherit; }
input:focus { outline: 2px solid var(--accent); outline-offset: -1px; border-color: transparent; }
button { height: 40px; border: 0; border-radius: 9px; background: var(--accent); color: #fff; font: 500 14px var(--font); cursor: pointer; }
button:focus-visible { outline: 2px solid var(--text); outline-offset: 2px; }
.error { min-height: 1em; margin: 0; color: var(--danger); font-size: 13px; }
.description { margin: 0; color: var(--muted); }
nav { font-size: 12px; text-align: center; color: var(--muted); }
a { color: var(--muted); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Draftwall</h1>
  <p class="description">Store and explore visual boards, files, and notes on a zoomable canvas.</p>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" autofocus required>
  <input type="hidden" name="next" value="{{next}}">
  <p class="error" role="alert">{{error}}</p>
  <button type="submit">Sign in</button>
  <nav aria-label="Legal"><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></nav>
</form>
</body>
</html>
