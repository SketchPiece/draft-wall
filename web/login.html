<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Draftwall</title>
<style>
:root { --bg: #0a0a0a; --panel: #111111; --field: #0a0a0a; --line: rgba(255,255,255,.1); --text: #ececec; --muted: #8e8e8e; --accent: #346bf1; --danger: #ff6369;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif; color-scheme: dark; }
@media (prefers-color-scheme: light) { :root { --bg: #f3f3f4; --panel: #fff; --field: #fafafa; --line: rgba(0,0,0,.12); --text: #18181b; --muted: #6b6b73; --accent: #2f63e6; --danger: #d93036; color-scheme: light; } }
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
main { width: min(340px, 100%); display: flex; flex-direction: column; gap: 12px; padding: 24px; background: var(--panel); border: 1px solid var(--line); border-radius: 14px; }
h1 { margin: 0 0 4px; font-size: 17px; font-weight: 600; }
a.google { display: flex; align-items: center; justify-content: center; gap: 10px; height: 40px; border: 1px solid var(--line); border-radius: 9px;
  background: var(--field); color: var(--text); font: 500 14px var(--font); text-decoration: none; }
a.google:hover { border-color: var(--muted); }
a.google svg { width: 18px; height: 18px; }
.error:empty { display: none; }
.error { margin: 0; color: var(--danger); font-size: 13px; }
.description { margin: 0; color: var(--muted); }
nav { font-size: 12px; text-align: center; color: var(--muted); }
a { color: var(--muted); }
a:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; }
</style>
</head>
<body>
<main>
  <h1>Draftwall</h1>
  <p class="description">Store and explore visual boards, files, and notes on a zoomable canvas.</p>
  <p class="error" role="alert">{{error}}</p>
  <a class="google" href="{{href}}">
    <svg viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.6 5.4 2.6 13.2l7.9 6.2C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.1 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.4c-.5 2.9-2.2 5.3-4.6 7l7.2 5.6c4.2-3.9 7.1-9.7 7.1-17.1z"/><path fill="#FBBC05" d="M10.5 28.6c-.5-1.4-.8-3-.8-4.6s.3-3.2.8-4.6l-7.9-6.2C.9 16.5 0 20.1 0 24s.9 7.5 2.6 10.8l7.9-6.2z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.2-5.6c-2.2 1.5-5 2.4-8.7 2.4-6.3 0-11.6-4.2-13.5-9.9l-7.9 6.2C6.6 42.6 14.6 48 24 48z"/></svg>
    Continue with Google
  </a>
  <nav aria-label="Legal"><a href="/privacy">Privacy Policy</a> · <a href="/terms">Terms of Service</a></nav>
</main>
</body>
</html>
