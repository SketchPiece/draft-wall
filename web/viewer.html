<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Canvas</title>
<style>
/* Canvas viewer. Look follows T3 Code: near-black ground, quiet panels, one blue accent. */
:root {
  --bg: #0a0a0a; --panel: #111111; --panel-2: #161616; --hover: #1f1f1f; --pressed: #262626;
  --line: rgba(255,255,255,.08); --line-2: rgba(255,255,255,.14);
  --text: #ececec; --muted: #8e8e8e; --faint: #5a5a5a;
  --accent: #346bf1; --danger: #e5484d;
  --dot: rgba(255,255,255,.075);
  --board-edge: rgba(255,255,255,.07); --board-shadow: 0 10px 40px rgba(0,0,0,.55); --chrome-shadow: 0 4px 16px rgba(0,0,0,.3);
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", system-ui, sans-serif;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
  --top: env(safe-area-inset-top, 0px); --bottom: env(safe-area-inset-bottom, 0px);
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root {
    --bg: #f3f3f4; --panel: #ffffff; --panel-2: #fafafa; --hover: #f0f0f1; --pressed: #e7e7e9;
    --line: rgba(0,0,0,.08); --line-2: rgba(0,0,0,.15);
    --text: #18181b; --muted: #6b6b73; --faint: #a3a3ab;
    --accent: #2f63e6; --danger: #d93036;
    --dot: rgba(0,0,0,.1);
    --board-edge: rgba(0,0,0,.08); --board-shadow: 0 6px 28px rgba(0,0,0,.09); --chrome-shadow: 0 4px 16px rgba(0,0,0,.08);
    color-scheme: light;
  }
}
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--bg); color: var(--text); font: 13px/1.4 var(--font); overflow: hidden; -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
[hidden] { display: none !important; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
button:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
svg { display: block; flex: none; }

#stage { position: fixed; inset: 0; overflow: hidden; touch-action: none;
  background-image: radial-gradient(circle, var(--dot) 1px, transparent 1.3px); }
#stage.hand { cursor: grab; }
#stage.sticky { cursor: crosshair; }
#stage.grabbing, #stage.grabbing * { cursor: grabbing !important; }
#world { position: absolute; left: 0; top: 0; transform-origin: 0 0; --z: 1; }

.board { position: absolute; }
.board .sheet { position: absolute; inset: 0; overflow: hidden; background: #fff; border-radius: 2px;
  box-shadow: 0 0 0 calc(1px / var(--z)) var(--board-edge), var(--board-shadow); }
.board iframe { display: block; width: 100%; height: 100%; border: 0; pointer-events: none; background: #fff; }
.board .hit { position: absolute; inset: 0; }
.board.selected .sheet { box-shadow: 0 0 0 calc(2px / var(--z)) var(--accent), var(--board-shadow); }

.label { position: absolute; left: 0; right: 0; bottom: 100%; display: flex; align-items: center;
  gap: calc(4px / var(--z)); padding-bottom: calc(8px / var(--z)); font-size: calc(13px / var(--z));
  color: var(--muted); white-space: nowrap; }
.label .name { flex: 1 1 auto; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.board.selected .label, .board:hover .label { color: var(--text); }
.label button, .label a { display: grid; place-items: center; width: calc(22px / var(--z)); height: calc(22px / var(--z));
  border-radius: calc(6px / var(--z)); color: var(--muted); opacity: 0; transition: opacity .12s; }
.label svg { width: calc(14px / var(--z)); height: calc(14px / var(--z)); }
.board:hover .label button, .board:hover .label a, .board.selected .label button, .board.selected .label a { opacity: 1; }
.label button:hover, .label a:hover { background: var(--hover); color: var(--text); }

.note { position: absolute; width: max-content; color: var(--text); white-space: pre-wrap; text-wrap: balance; letter-spacing: -.015em; }
.note.title1 { font-size: 72px; line-height: 1.1; font-weight: 700; }
.note.title2 { font-size: 44px; line-height: 1.15; font-weight: 650; }
.note.text { font-size: 24px; line-height: 1.45; font-weight: 400; color: var(--muted); letter-spacing: 0; }

/* Sticky notes (canvas.json "annotations"). Paper colors stay the same in both themes. */
.ann { position: absolute; min-height: 120px; padding: 18px 20px 22px; border-radius: 3px; color: #1d1b16;
  font: 22px/1.4 var(--font); white-space: pre-wrap; overflow-wrap: anywhere; background: #f6de7b;
  box-shadow: 0 1px 0 rgba(0,0,0,.06), 0 calc(6px / var(--z)) calc(18px / var(--z)) rgba(0,0,0,.28); }
.ann[data-color="green"] { background: #bfe6b4; }
.ann[data-color="blue"] { background: #bcd6fb; }
.ann[data-color="pink"] { background: #f7c4d8; }
.ann[data-color="gray"] { background: #e4e4e2; }
.ann.bold { font-weight: 650; }
.ann.italic { font-style: italic; }
.ann.selected { outline: calc(2px / var(--z)) solid var(--accent); outline-offset: calc(3px / var(--z)); }
.ann .empty { color: rgba(29,27,22,.45); }
.ann textarea { display: block; width: 100%; min-height: 80px; margin: 0; padding: 0; border: 0; outline: 0; resize: none; overflow: hidden;
  background: transparent; color: inherit; font: inherit; line-height: inherit; user-select: text; -webkit-user-select: text; }

/* Floating chrome */
.bar { position: fixed; z-index: 5; display: flex; align-items: center; gap: 2px; height: 36px; padding: 0 4px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--chrome-shadow); }
#bar-left { left: 12px; top: calc(12px + var(--top)); max-width: calc(100vw - 196px); }
#bar-right { right: 12px; top: calc(12px + var(--top)); }
#tools { left: 50%; bottom: calc(14px + var(--bottom)); transform: translateX(-50%); height: 44px; padding: 0 5px; gap: 3px; }
.ibtn { display: grid; place-items: center; width: 28px; height: 28px; border-radius: 7px; color: var(--muted); }
#tools .ibtn { width: 34px; height: 34px; border-radius: 8px; }
.ibtn:hover { background: var(--hover); color: var(--text); }
.ibtn[aria-pressed="true"] { background: var(--pressed); color: var(--text); }
#tools .ibtn[aria-pressed="true"] { background: var(--accent); color: #fff; }
.ibtn svg { width: 16px; height: 16px; }
#tools svg { width: 18px; height: 18px; }
#home { color: var(--muted); }
#title { padding: 0 8px 0 4px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
#count { padding-right: 8px; color: var(--faint); font-variant-numeric: tabular-nums; white-space: nowrap; }
.sep { width: 1px; height: 18px; background: var(--line); margin: 0 4px; flex: none; }
.zoom { min-width: 50px; height: 28px; padding: 0 6px; border-radius: 7px; color: var(--text); font-variant-numeric: tabular-nums; }
.zoom:hover { background: var(--hover); }
@media (max-width: 520px) { #count, #bar-right .sep, #fit { display: none; } #bar-left { max-width: calc(100vw - 150px); } }

#panel { position: fixed; z-index: 4; left: 12px; top: calc(56px + var(--top)); width: 240px; max-height: calc(100% - 140px); overflow: auto;
  padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--chrome-shadow); }
#panel h2 { margin: 4px 8px 6px; font-size: 11px; font-weight: 500; color: var(--faint); }
#panel ol { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 1px; }
#panel li button { display: flex; width: 100%; align-items: center; gap: 8px; height: 30px; padding: 0 8px; border-radius: 7px; color: var(--muted); text-align: left; }
#panel li button:hover { background: var(--hover); color: var(--text); }
#panel li button[aria-current="true"] { background: var(--pressed); color: var(--text); }
#panel li .t { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#panel li .s { color: var(--faint); font: 11px var(--mono); }

#ann-bar { position: fixed; z-index: 6; height: 36px; gap: 4px; }
#ann-bar .dot { width: 20px; height: 20px; margin: 0 2px; border-radius: 50%; box-shadow: inset 0 0 0 1px rgba(0,0,0,.15); }
#ann-bar .dot[aria-pressed="true"] { box-shadow: 0 0 0 2px var(--panel), 0 0 0 4px var(--accent); }
#ann-bar .del:hover { color: var(--danger); }

#empty { position: fixed; inset: 0; display: grid; place-items: center; color: var(--muted); pointer-events: none; text-align: center; line-height: 1.6; }
#empty a { color: var(--text); pointer-events: auto; }
body.readonly [data-tool="sticky"], body.readonly #tools .sep { display: none; }

#share-btn { width: auto; padding: 0 10px; gap: 6px; display: flex; color: var(--text); font-weight: 500; }
#share { position: fixed; z-index: 6; right: 12px; top: calc(56px + var(--top)); width: min(340px, calc(100vw - 24px)); padding: 12px;
  background: var(--panel); border: 1px solid var(--line); border-radius: 10px; box-shadow: var(--chrome-shadow); }
#share h2 { margin: 0 0 4px; font-size: 13px; font-weight: 600; }
#share p { margin: 0 0 10px; color: var(--muted); font-size: 12px; }
#share form { display: flex; gap: 6px; margin-bottom: 8px; }
#share input, #share select { height: 30px; min-width: 0; padding: 0 8px; border: 1px solid var(--line-2); border-radius: 7px;
  background: var(--panel-2); color: var(--text); font: inherit; }
#share input { flex: 1; }
#share input:focus, #share select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
#share form button { height: 30px; padding: 0 10px; border-radius: 7px; background: var(--accent); color: #fff; font-weight: 500; }
#share ul { list-style: none; margin: 0; padding: 0; max-height: 50vh; overflow: auto; }
#share li { display: flex; align-items: center; gap: 6px; min-height: 34px; }
#share li .e { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#share li .r { color: var(--faint); padding-right: 8px; }
#share li select { height: 26px; padding: 0 4px; }
#share li .ibtn:hover { color: var(--danger); }
#share-copy { margin-top: 8px; height: 28px; padding: 0 10px; border-radius: 7px; border: 1px solid var(--line-2); color: var(--text); }
#share-copy:hover { background: var(--hover); }
#toast { position: fixed; left: 50%; bottom: calc(72px + var(--bottom)); transform: translateX(-50%); z-index: 9; max-width: calc(100vw - 32px); padding: 8px 12px;
  background: var(--panel); border: 1px solid var(--line-2); border-radius: 9px; color: var(--text); box-shadow: var(--chrome-shadow); }

/* Full-size view of one board, interactive */
#focus { position: fixed; inset: 0; z-index: 8; display: flex; flex-direction: column; background: var(--bg); }
#focus header { display: flex; align-items: center; gap: 2px; min-height: 52px; padding: var(--top) 10px 0; border-bottom: 1px solid var(--line); }
#focus-back { display: flex; align-items: center; gap: 6px; height: 32px; padding: 0 10px 0 6px; border-radius: 8px; color: var(--text); font-weight: 500; }
#focus-back:hover { background: var(--hover); }
#focus-back svg { width: 16px; height: 16px; }
#focus-title { flex: 1; min-width: 0; padding: 0 8px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#focus-pos { color: var(--faint); font-variant-numeric: tabular-nums; padding: 0 6px; }
#focus-body { position: relative; flex: 1; overflow: auto; display: flex; }
#focus-sizer { position: relative; flex: none; margin: auto; }
#focus-frame { position: absolute; left: 24px; top: 24px; transform-origin: 0 0; background: #fff; box-shadow: 0 0 0 1px var(--board-edge), var(--board-shadow); }
#focus-frame iframe { display: block; width: 100%; height: 100%; border: 0; }
@media (max-width: 520px) { #focus-title, #focus-open, #focus .sep { display: none; } #focus header { justify-content: space-between; } }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<div id="stage"><div id="world"></div></div>

<div class="bar" id="bar-left">
  <a class="ibtn" id="home" href="/" title="All canvases" aria-label="All canvases">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2.5" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="9" y="2.5" width="4.5" height="4.5" rx="1"/><rect x="2.5" y="9" width="4.5" height="4.5" rx="1"/><rect x="9" y="9" width="4.5" height="4.5" rx="1"/></svg>
  </a>
  <button class="ibtn" id="panel-btn" aria-pressed="false" title="Boards (B)" aria-label="Boards">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><rect x="2" y="2.5" width="12" height="11" rx="2"/><path d="M6 2.5v11"/></svg>
  </button>
  <span id="title">Canvas</span>
  <span id="count"></span>
</div>

<div class="bar" id="bar-right">
  <button class="ibtn" id="share-btn" hidden aria-expanded="false" aria-controls="share">Share</button>
  <span class="sep" id="share-sep" hidden></span>
  <button class="ibtn" id="zoom-out" title="Zoom out (−)" aria-label="Zoom out">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 8h9"/></svg>
  </button>
  <button class="zoom" id="zoom" title="Fit all (⇧1)">100%</button>
  <button class="ibtn" id="zoom-in" title="Zoom in (+)" aria-label="Zoom in">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 8h9M8 3.5v9"/></svg>
  </button>
  <span class="sep"></span>
  <button class="ibtn" id="fit" title="Fit all (⇧1)" aria-label="Fit all">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M2.5 6V3.5a1 1 0 0 1 1-1H6M10 2.5h2.5a1 1 0 0 1 1 1V6M13.5 10v2.5a1 1 0 0 1-1 1H10M6 13.5H3.5a1 1 0 0 1-1-1V10"/></svg>
  </button>
</div>

<div class="bar" id="tools" role="toolbar" aria-label="Tools">
  <button class="ibtn" data-tool="select" aria-pressed="true" title="Select (V)" aria-label="Select">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M4 2.8 14.2 9l-4.6 1.1-2.2 4.4L4 2.8Z"/></svg>
  </button>
  <button class="ibtn" data-tool="hand" aria-pressed="false" title="Hand (H)" aria-label="Hand">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9V4.2a1.2 1.2 0 0 1 2.4 0V8.5M8.4 8V3.2a1.2 1.2 0 0 1 2.4 0V8M10.8 8.2V4.4a1.2 1.2 0 0 1 2.4 0v5.8c0 3-1.9 5.3-4.8 5.3-2 0-3.1-.9-4.2-2.6L2.6 10a1.1 1.1 0 0 1 1.8-1.3L6 10.6"/></svg>
  </button>
  <span class="sep"></span>
  <button class="ibtn" data-tool="sticky" aria-pressed="false" title="Sticky note (S)" aria-label="Sticky note">
    <svg viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><path d="M3 3.5a.5.5 0 0 1 .5-.5h11a.5.5 0 0 1 .5.5V11l-4 4H3.5a.5.5 0 0 1-.5-.5v-11Z"/><path d="M15 11h-3.5a.5.5 0 0 0-.5.5V15"/></svg>
  </button>
</div>

<div class="bar" id="ann-bar" hidden>
  <button class="dot" data-color="" style="background:#f6de7b" aria-label="Yellow"></button>
  <button class="dot" data-color="green" style="background:#bfe6b4" aria-label="Green"></button>
  <button class="dot" data-color="blue" style="background:#bcd6fb" aria-label="Blue"></button>
  <button class="dot" data-color="pink" style="background:#f7c4d8" aria-label="Pink"></button>
  <button class="dot" data-color="gray" style="background:#e4e4e2" aria-label="Gray"></button>
  <span class="sep"></span>
  <button class="ibtn del" id="ann-del" title="Delete (⌫)" aria-label="Delete note">
    <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M3 4.5h10M6.5 4.5V3h3v1.5M4.5 4.5l.6 8.5h5.8l.6-8.5"/></svg>
  </button>
</div>

<nav id="panel" hidden aria-label="Boards">
  <h2>Boards</h2>
  <ol id="panel-list"></ol>
</nav>

<section id="share" hidden aria-labelledby="share-title">
  <h2 id="share-title">Share</h2>
  <p>People sign in with Google to open it. A domain like <b>@company.com</b> lets in everyone there.</p>
  <form id="share-form">
    <input id="share-email" type="text" inputmode="email" autocomplete="off" placeholder="name@gmail.com or @company.com" aria-label="Email or domain">
    <select id="share-role" aria-label="Role"><option value="viewer">Can view</option><option value="editor">Can comment</option></select>
    <button type="submit">Add</button>
  </form>
  <ul id="share-list"></ul>
  <button type="button" id="share-copy">Copy link</button>
</section>

<div id="empty" hidden></div>
<div id="toast" hidden role="status"></div>

<section id="focus" hidden aria-modal="true" role="dialog" aria-labelledby="focus-title">
  <header>
    <button id="focus-back" title="Back to canvas (Esc)">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M10 3.5 5.5 8l4.5 4.5"/></svg>Canvas
    </button>
    <span id="focus-title"></span>
    <button class="ibtn" id="focus-prev" title="Previous board (←)" aria-label="Previous board">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 12.5V3.5M4 7.5l4-4 4 4"/></svg>
    </button>
    <span id="focus-pos"></span>
    <button class="ibtn" id="focus-next" title="Next board (→)" aria-label="Next board">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M8 3.5v9M4 8.5l4 4 4-4"/></svg>
    </button>
    <span class="sep"></span>
    <button class="ibtn" id="focus-out" title="Zoom out (−)" aria-label="Zoom out">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 8h9"/></svg>
    </button>
    <button class="zoom" id="focus-zoom" title="Fit to window / 100%">100%</button>
    <button class="ibtn" id="focus-in" title="Zoom in (+)" aria-label="Zoom in">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M3.5 8h9M8 3.5v9"/></svg>
    </button>
    <span class="sep"></span>
    <a class="ibtn" id="focus-open" target="_blank" rel="noopener" title="Open in new tab" aria-label="Open in new tab">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M6.5 3.5h-3v9h9v-3"/></svg>
    </a>
  </header>
  <div id="focus-body"><div id="focus-sizer"><div id="focus-frame"><iframe id="focus-iframe" title="Board" sandbox="allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals"></iframe></div></div></div>
</section>

<script>
(() => {
  const $ = s => document.querySelector(s);
  const stage = $('#stage'), world = $('#world');
  const Z_MIN = 0.03, Z_MAX = 4, PAD = 64;
  const SANDBOX = 'allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-modals';
  const ICON_EXPAND = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9.5 2.5h4v4M13.5 2.5 9 7M6.5 13.5h-4v-4M2.5 13.5 7 9"/></svg>';
  const ICON_OPEN = '<svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.4"><path d="M9 2.5h4.5V7M13.5 2.5 7.5 8.5M6.5 3.5h-3v9h9v-3"/></svg>';

  const id = decodeURIComponent((location.pathname.match(/^\/c\/([^/]+)/) || [])[1] || 'local');
  const API = '/api/canvases/' + encodeURIComponent(id);

  let data = null, doc = null;
  let view = { x: 0, y: 0, z: 1 }, sel = null, tool = 'select', space = false;
  let focusFile = null, focusFit = true, focusZoom = 1;
  let editing = null, saving = false, saveTimer = null, busy = false;
  let canEdit = true; // viewers only look: no notes, no moving boards
  const boardEls = new Map();
  const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
  const store = {
    get(k) { try { return JSON.parse(localStorage.getItem(k)); } catch { return null; } },
    set(k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} },
  };
  const viewKey = 'canvas-view:' + id;
  const files = () => doc ? doc.order.filter(f => doc.boards[f]) : [];
  const fileUrl = f => data.fileBase + f.split('/').map(encodeURIComponent).join('/') + '?v=' + encodeURIComponent(data.files?.[f] ?? '0');
  const ann = aid => doc.annotations.find(a => a.id === aid);
  const topInset = () => parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--top')) || 0;

  // ---------- view ----------
  function apply() {
    world.style.transform = `translate(${view.x}px, ${view.y}px) scale(${view.z})`;
    world.style.setProperty('--z', view.z);
    let g = 24 * view.z; while (g < 12) g *= 4;
    stage.style.backgroundSize = `${g}px ${g}px`;
    stage.style.backgroundPosition = `${view.x}px ${view.y}px`;
    $('#zoom').textContent = Math.round(view.z * 100) + '%';
    placeAnnBar();
    store.set(viewKey, { ...view, vw: innerWidth });
  }
  function zoomAt(z, cx, cy) {
    const nz = clamp(z, Z_MIN, Z_MAX);

  function toast(msg) { const t = $('#toast'); t.textContent = msg; t.hidden = false; clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200); }

  addEventListener('keydown', e => {
    if (e.target.closest?.('input, textarea, [contenteditable]')) return;
    if (focusFile) {
      if (e.key === 'Escape') closeFocus();
      else if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') stepFocus(-1);
      else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') stepFocus(1);
      else if (e.key === '+' || e.key === '=') focusBy(1.25);
      else if (e.key === '-') focusBy(0.8);
      else if (e.shiftKey && e.code === 'Digit1') { focusFit = true; layoutFocus(); }
      return;
    }
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    if (e.code === 'Space' && !space) { space = true; stage.classList.add('hand'); e.preventDefault(); return; }
    const k = e.key.toLowerCase();
    if (e.key === 'Escape') { select(null); setTool('select'); if (!$('#share').hidden) toggleShare(); }
    else if ((e.key === 'Backspace' || e.key === 'Delete') && sel?.type === 'ann') deleteAnn(sel.id);
    else if (e.key === 'Enter' && sel?.type === 'ann') { e.preventDefault(); editAnn(sel.id); }
    else if (e.key === 'Enter' && sel?.type === 'board') openFocus(sel.id);
    else if (k === 'v') setTool('select');
    else if (k === 'h') setTool('hand');
    else if ((k === 's' || k === 'n') && canEdit) setTool('sticky');
    else if (k === 'b') togglePanel();
    else if (e.shiftKey && e.code === 'Digit1') fitAll();
    else if (e.shiftKey && e.code === 'Digit2' && sel?.type === 'board') fitBoard(sel.id);
    else if (e.shiftKey && e.code === 'Digit0') zoomAt(1, innerWidth / 2, innerHeight / 2);
    else if (e.key === '+' || e.key === '=') zoomCenter(1.25);
    else if (e.key === '-') zoomCenter(0.8);
    else if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') {
      const fs = files(); if (!fs.length) return;
      const i = sel?.type === 'board' ? fs.indexOf(sel.id) : -1;
      const f = fs[(i + (e.key === 'ArrowRight' ? 1 : -1) + fs.length) % fs.length];
      select({ type: 'board', id: f }); fitBoard(f);
    }
  });
  addEventListener('keyup', e => { if (e.code === 'Space') { space = false; stage.classList.toggle('hand', tool === 'hand'); } });

  load(true).then(() => { if (data) poll(); });
})();
</script>
